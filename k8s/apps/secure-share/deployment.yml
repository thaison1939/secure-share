# k8s/apps/secure-share/deployment.yml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-share
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secure-share
  template:
    metadata:
      labels:
        app: secure-share
        version: v1
      annotations:
        sidecar.istio.io/inject: "false"  # ✅ Explicitly disable Istio injection
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
      - name: secure-share
        image: ghcr.io/thaison1939/secure-share:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        env:
        - name: NODE_ENV
          value: "production"
        - name: NEXT_PUBLIC_API_URL
          value: "https://secure-share-worker.thaison1939.workers.dev"
        - name: UPLOAD_AUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: secure-share-secrets
              key: upload-auth-secret
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /api/health
            port: 3000
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 12
---
apiVersion: v1
kind: Service
metadata:
  name: secure-share-service
  namespace: production
spec:
  selector:
    app: secure-share
  type: NodePort
  ports:
  - port: 80
    targetPort: 3000
    nodePort: 30080
    protocol: TCP