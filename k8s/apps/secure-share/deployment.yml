# k8s/apps/secure-share/deployment.yml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-share
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secure-share
  template:
    metadata:
      labels:
        app: secure-share
    spec:
      containers:
      - name: secure-share
        image: ghcr.io/thaison1939/secure-share:7e7456e8b69d3e0f91ca7db90a0281a0ada86905
        ports:
        - containerPort: 3000
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        env:
        - name: NODE_ENV
          value: "production"
        - name: NEXT_PUBLIC_API_URL
          value: "https://secure-share-worker.thaison1939.workers.dev"
        - name: UPLOAD_AUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: secure-share-secrets
              key: upload-auth-secret
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: secure-share-service
  namespace: production
spec:
  selector:
    app: secure-share
  ports:
  - name: http
    port: 80
    targetPort: 3000
    protocol: TCP
  type: ClusterIP
