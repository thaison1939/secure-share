# k8s/infrastructure/ingress/nginx-ingress.yml
apiVersion: v1
kind: Namespace
metadata:
  name: ingress-nginx
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: ingress-nginx
  namespace: kube-system
spec:
  chart: ingress-nginx
  repo: https://kubernetes.github.io/ingress-nginx
  targetNamespace: ingress-nginx
  valuesContent: |-
    controller:
      service:
        type: NodePort
        nodePorts:
          http: 30080
          https: 30443
      hostPort:
        enabled: true
        ports:
          http: 80
          https: 443