name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main # Or your default branch like 'master'
    paths:
      - 'server/**' # Trigger only when changes are made in the 'server' directory
  
  workflow_dispatch: # Enable manual triggering from the GitHub UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Worker
    
    permissions:
      contents: read
      id-token: write # Required for Wrangler to authenticate with Cloudflare
      actions: read
    # --- NEW FIX: Move the 'env' block to the job level ---
    # This ensures these environment variables are available to ALL steps in this job
    env:
      UPLOAD_AUTH_SECRET: ${{ secrets.UPLOAD_AUTH_SECRET }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
    # ------------------------------------------------------

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Use a Node.js version compatible with your Worker (e.g., 20 or 22)

      - name: Install server dependencies
        run: npm install
        working-directory: ./server # Run npm install within the 'server' directory

      - name: Build Worker (TypeScript compilation)
        run: npm run build # Uses the 'build: "tsc"' script you'll add to server/package.json
        working-directory: ./server

      # --- DIAGNOSTIC STEP: Check if secrets are correctly exposed as environment variables ---
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3 # Use the official Wrangler GitHub Action
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }} # CF_API_TOKEN can be a Repository Secret (or also an Environment Secret)
          workingDirectory: ./server
          # These secrets are now correctly passed to Wrangler because they are
          # established as environment variables at the job level (in the `env` block above),
          # and the `wrangler-action` automatically looks for these names in the environment.
          secrets: |
            UPLOAD_AUTH_SECRET
            UPSTASH_REDIS_REST_URL
            UPSTASH_REDIS_REST_TOKEN
