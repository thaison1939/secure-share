  # Stage 2: Build & Test
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: ./client
        run: npm ci

      - name: Build frontend
        working-directory: ./client
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ARM64 image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./docker/Dockerfile.rpi
          platforms: linux/arm64
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/secure-share-image.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/secure-share-image.tar

  # Stage 3: Container Security Scan
  container-security:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load --input /tmp/secure-share-image.tar

      - name: Run Trivy container scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-container-results.sarif'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true  # Continue even if Trivy fails

      - name: Upload container scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-container-results.sarif'
        continue-on-error: true  # Continue even if upload fails

  # Stage 4: Deploy K3s
  deploy-k3s:
    runs-on: ubuntu-latest
    needs: [build-test, container-security]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write        # Required for git push
      packages: write        # Required for pushing to GHCR
      security-events: write # Required for security scans
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load and push Docker image
        run: |
          docker load --input /tmp/secure-share-image.tar
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Update K8s deployment manifest
        run: |
          sed -i "s|image: ghcr.io/.*/secure-share:.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}|g" k8s/apps/secure-share/deployment.yml

      - name: Commit and push updated manifest
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add k8s/apps/secure-share/deployment.yml
          git commit -m "Update image to ${{ github.sha }}" || exit 0
          git push

      - name: Trigger ArgoCD sync via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.RPI_HOST }}      # e.g., 0.tcp.ap.ngrok.io
          port: ${{ secrets.RPI_PORT }}      # e.g., 12345
          username: ${{ secrets.RPI_USER }}
          key: ${{ secrets.RPI_SSH_KEY }}
          timeout: 30s
          command_timeout: 30s
          debug: false
          script: |
            echo "Connected to $(hostname)"
            kubectl patch application secure-share-app -n argocd \
              --type='merge' \
              -p='{"spec":{"source":{"targetRevision":"HEAD"}}}'
            kubectl annotate application secure-share-app -n argocd \
              argocd.argoproj.io/refresh=hard --overwrite
            kubectl wait --for=condition=Synced application/secure-share-app -n argocd --timeout=300s
            kubectl rollout status deployment/secure-share -n production --timeout=300s