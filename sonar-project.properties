# sonarqube/sonar-project.properties
sonar.projectKey=thaison1939_secure-share
sonar.organization=thaison1939
sonar.projectName=Secure Share
sonar.projectVersion=1.0

# Source code paths
sonar.sources=client/src,server/src

# Language and encoding
sonar.sourceEncoding=UTF-8

# JavaScript/TypeScript specific settings
sonar.typescript.node=18

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/coverage/**

# Quality gate
sonar.qualitygate.wait=true